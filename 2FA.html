<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>2FA TOTP Generator</title>
</head>
<body>
  <h3>TOTP 2FA 计算</h3>

  <input id="secret" placeholder="输入 Base32 Secret" style="width:300px">
  <button onclick="gen()">生成验证码</button>

  <p>当前验证码：<b id="code">----</b></p>

<script>
/* Base32 解码 */
function base32ToBytes(base32) {
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  let bits = "";
  let bytes = [];

  base32 = base32.replace(/=+$/, "").toUpperCase();

  for (let c of base32) {
    const val = alphabet.indexOf(c);
    if (val === -1) continue;
    bits += val.toString(2).padStart(5, "0");
  }

  for (let i = 0; i + 8 <= bits.length; i += 8) {
    bytes.push(parseInt(bits.substring(i, i + 8), 2));
  }

  return new Uint8Array(bytes);
}

/* 生成 TOTP */
async function generateTOTP(secret, step = 30, digits = 6) {
  const key = base32ToBytes(secret);
  const epoch = Math.floor(Date.now() / 1000);
  const counter = Math.floor(epoch / step);

  const buffer = new ArrayBuffer(8);
  const view = new DataView(buffer);
  view.setUint32(4, counter);

  const cryptoKey = await crypto.subtle.importKey(
    "raw",
    key,
    { name: "HMAC", hash: "SHA-1" },
    false,
    ["sign"]
  );

  const hmac = new Uint8Array(
    await crypto.subtle.sign("HMAC", cryptoKey, buffer)
  );

  const offset = hmac[hmac.length - 1] & 0xf;
  const code =
    ((hmac[offset] & 0x7f) << 24) |
    ((hmac[offset + 1] & 0xff) << 16) |
    ((hmac[offset + 2] & 0xff) << 8) |
    (hmac[offset + 3] & 0xff);

  return (code % 10 ** digits).toString().padStart(digits, "0");
}

async function gen() {
  const secret = document.getElementById("secret").value.trim();
  if (!secret) return;

  const code = await generateTOTP(secret);
  document.getElementById("code").innerText = code;
}
</script>
</body>
</html>
