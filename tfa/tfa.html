<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地 2FA 验证码生成器</title>

    <script src="https://unpkg.com/@otplib/preset-browser@^12.0.1/buffer.js"></script>
    <script src="https://unpkg.com/@otplib/preset-browser@^12.0.1/index.js"></script>

    <style>
        :root {
            --bg: #0f1115;
            --card: #1b1f27;
            --text: #ffffff;
            --subtext: #a0a7b4;
            --input-bg: #11151c;
            --input-border: #2d3748;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --progress-bg: #2d3748;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        body.light {
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #202124;
            --subtext: #666;
            --input-bg: #ffffff;
            --input-border: #ddd;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --progress-bg: #eee;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            transition:
                background-color 0.25s,
                color 0.25s,
                border-color 0.25s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
        }

        .card {
            position: relative;
            background: var(--card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 20px var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            text-transform: uppercase;
            background: var(--input-bg);
            color: var(--text);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .code-display {
            font-size: 48px;
            font-weight: bold;
            color: var(--text);
            letter-spacing: 4px;
            margin: 15px 0;
            min-height: 60px;
        }

        .progress-container {
            width: 100%;
            height: 5px;
            background: var(--progress-bg);
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 1s linear;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition:
                background 0.2s,
                transform 0.1s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .hint {
            font-size: 12px;
            color: var(--subtext);
            margin-top: 10px;
        }

        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: var(--input-border);
        }
    </style>
</head>

<body>
    <div class="card">
        <button class="theme-toggle" id="themeBtn">☀️</button>

        <h2>2FA 生成器</h2>

        <input
            type="text"
            id="secret"
            placeholder="在此输入 2FA 密钥 (Secret Key)"
            spellcheck="false"
        />

        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div class="code-display" id="code">------</div>

        <button onclick="copyCode()">复制验证码</button>

        <p class="hint">密钥仅在浏览器本地处理，不会上传</p>
    </div>

    <script>
        const secretInput = document.getElementById("secret");
        const codeDisplay = document.getElementById("code");
        const progressBar = document.getElementById("progress-bar");
        const themeBtn = document.getElementById("themeBtn");

        // =========================
        // 主题系统
        // =========================

        function setTheme(theme) {
            if (theme === "light") {
                document.body.classList.add("light");
                themeBtn.innerText = "🌙";
            } else {
                document.body.classList.remove("light");
                themeBtn.innerText = "☀️";
            }

            localStorage.setItem("theme", theme);
        }

        // 默认黑暗模式
        const savedTheme = localStorage.getItem("theme") || "dark";
        setTheme(savedTheme);

        themeBtn.addEventListener("click", () => {
            const isLight = document.body.classList.contains("light");
            setTheme(isLight ? "dark" : "light");
        });

        // =========================
        // OTP
        // =========================

        function getCleanSecret() {
            return secretInput.value.replace(/\s+/g, "").toUpperCase();
        }

        function updateOTP() {
            const secret = getCleanSecret();
            const step = 30;
            const epoch = Math.floor(Date.now() / 1000);
            const remaining = step - (epoch % step);

            // 更新进度条
            const progressWidth = (remaining / step) * 100;
            progressBar.style.width = progressWidth + "%";

            if (secret.length >= 8) {
                try {
                    const token =
                        otplib.authenticator.generate(secret);

                    codeDisplay.innerText = token;
                    codeDisplay.style.fontSize = "48px";
                } catch (err) {
                    codeDisplay.innerText = "错误";
                    codeDisplay.style.fontSize = "24px";
                }
            } else {
                codeDisplay.innerText = "------";
                codeDisplay.style.fontSize = "48px";
            }
        }

        function copyCode() {
            const code = codeDisplay.innerText;

            if (code !== "------" && code !== "错误") {
                navigator.clipboard.writeText(code).then(() => {
                    const btn = document.querySelector(
                        '.card > button:not(.theme-toggle)'
                    );

                    const originalText = btn.innerText;

                    btn.innerText = "已复制！";
                    btn.style.background = "#34a853";

                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.background = "";
                    }, 1500);
                });
            }
        }

        setInterval(updateOTP, 1000);
        secretInput.addEventListener("input", updateOTP);
    </script>
</body>
</html>
