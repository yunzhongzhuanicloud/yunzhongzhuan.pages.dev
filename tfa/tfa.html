<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地 2FA 验证码生成器</title>
    <script src="buffer.js"></script>
    <script src="index.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #1a73e8; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-transform: uppercase; }
        .code-display { font-size: 48px; font-weight: bold; color: #202124; letter-spacing: 4px; margin: 15px 0; min-height: 60px; }
        .progress-container { width: 100%; height: 5px; background: #eee; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        #progress-bar { height: 100%; background: #1a73e8; width: 0%; transition: width 1s linear; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; transition: background 0.2s; }
        button:hover { background: #1557b0; }
        button:active { transform: scale(0.98); }
        .hint { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>2FA 生成器</h2>
    <input type="text" id="secret" placeholder="在此输入 2FA 密钥 (Secret Key)" spellcheck="false">
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="code-display" id="code">------</div>
    
    <button onclick="copyCode()">复制验证码</button>
    <p class="hint">密钥仅在浏览器本地处理，不会上传</p>
</div>

<script>
    const secretInput = document.getElementById('secret');
    const codeDisplay = document.getElementById('code');
    const progressBar = document.getElementById('progress-bar');

    // 格式化密钥（去除空格）
    function getCleanSecret() {
        return secretInput.value.replace(/\s+/g, '').toUpperCase();
    }

    function updateOTP() {
        const secret = getCleanSecret();
        const step = 30; // TOTP 标准步长
        const epoch = Math.floor(Date.now() / 1000);
        const remaining = step - (epoch % step);
        
        // 更新进度条
        const progressWidth = (remaining / step) * 100;
        progressBar.style.width = progressWidth + '%';

        if (secret.length >= 8) {
            try {
                // 使用 otplib 生成 token
                const token = otplib.authenticator.generate(secret);
                codeDisplay.innerText = token;
            } catch (err) {
                codeDisplay.innerText = "错误";
                codeDisplay.style.fontSize = "24px";
            }
        } else {
            codeDisplay.innerText = "------";
            codeDisplay.style.fontSize = "48px";
        }
    }

    function copyCode() {
        const code = codeDisplay.innerText;
        if (code !== "------" && code !== "错误") {
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('button');
                const originalText = btn.innerText;
                btn.innerText = "已复制！";
                btn.style.background = "#34a853";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "#1a73e8";
                }, 1500);
            });
        }
    }

    // 每秒刷新一次
    setInterval(updateOTP, 1000);
    secretInput.addEventListener('input', updateOTP);


    window.onload = function(){
        setTimeout(function(){document.getElementById('secret').focus()},10);
    }
</script>

</body>
</html>
