<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>TOTP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* { box-sizing: border-box; }

:root {
  --bg: #171717;
  --text: #e5e5e5;
  --muted: #a3a3a3;
  --border: #2a2a2a;

  --btn-bg: #ffffff;
  --btn-text: #000000;
}

[data-theme="light"] {
  --bg: #ffffff;
  --text: #1f2328;
  --muted: #57606a;
  --border: #d0d7de;

  --btn-bg: #2da44e;   /* GitHub green */
  --btn-text: #ffffff;
}

body {
  margin: 0;
  height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 380px;
}

.top {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 12px;
}

.toggle {
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}

/* 验证码 + 按钮行 */
.code-row {
  display: flex;
  align-items: center;
  margin-bottom: 26px;
}

.code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 76px;
  font-weight: 500;
  letter-spacing: 10px;
  margin-right: 12px;
  flex-shrink: 0;
}

/* COPY 按钮 */
.copy {
  background: var(--btn-bg);
  color: var(--btn-text);
  border: none;
  border-radius: 6px;
  padding: 8px 18px;       /* 更大 */
  font-size: 14px;          /* 略大 */
  font-weight: 700;         /* 加粗 */
  cursor: pointer;
  flex-shrink: 0;
}

.copy:active {
  transform: translateY(1px);
}

input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 8px 0;
  color: var(--text);
  font-size: 14px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  outline: none;
  letter-spacing: 1px;
}

input::placeholder {
  color: var(--muted);
}
</style>
</head>

<body data-theme="dark">
  <div class="container">
    <div class="top">
      <div class="toggle" onclick="toggleTheme()">黑 / 白</div>
    </div>

    <div class="code-row">
      <div class="code" id="code">------</div>
      <button class="copy" id="copyBtn" onclick="copyCode()">COPY</button>
    </div>

    <input
      id="secret"
      placeholder="Base32 secret"
      autocomplete="off"
    />
  </div>

<script>
const input = document.getElementById("secret");
const codeEl = document.getElementById("code");
const copyBtn = document.getElementById("copyBtn");
input.focus();

/* theme */
function toggleTheme() {
  document.body.dataset.theme =
    document.body.dataset.theme === "light" ? "dark" : "light";
}

/* base32 */
function base32ToBytes(str) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  let bits = "", bytes = [];
  str = str.replace(/=+$/, "").toUpperCase();

  for (let c of str) {
    const v = chars.indexOf(c);
    if (v < 0) continue;
    bits += v.toString(2).padStart(5, "0");
  }

  for (let i = 0; i + 8 <= bits.length; i += 8) {
    bytes.push(parseInt(bits.slice(i, i + 8), 2));
  }
  return new Uint8Array(bytes);
}

/* totp */
async function totp(secret) {
  const key = base32ToBytes(secret);
  if (!key.length) return "------";

  const counter = Math.floor(Date.now() / 1000 / 30);
  const buf = new ArrayBuffer(8);
  new DataView(buf).setUint32(4, counter);

  const cryptoKey = await crypto.subtle.importKey(
    "raw", key,
    { name: "HMAC", hash: "SHA-1" },
    false, ["sign"]
  );

  const hmac = new Uint8Array(
    await crypto.subtle.sign("HMAC", cryptoKey, buf)
  );

  const o = hmac[hmac.length - 1] & 0xf;
  const bin =
    ((hmac[o] & 0x7f) << 24) |
    ((hmac[o+1] & 0xff) << 16) |
    ((hmac[o+2] & 0xff) << 8) |
    (hmac[o+3] & 0xff);

  return (bin % 1e6).toString().padStart(6, "0");
}

/* update */
async function update() {
  codeEl.textContent = await totp(input.value.trim());
}

setInterval(update, 1000);
update();

/* copy */
function copyCode() {
  const text = codeEl.textContent;
  if (text.includes("-")) return;

  navigator.clipboard.writeText(text);
  copyBtn.textContent = "COPIED";
  setTimeout(() => copyBtn.textContent = "COPY", 1200);
}
</script>
</body>
</html>
